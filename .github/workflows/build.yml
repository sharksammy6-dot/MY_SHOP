name: Build MY SHOP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MY SHOP APK
    runs-on: ubuntu-22.04

    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "========================================"
          echo "MY SHOP BUILD ENVIRONMENT"
          echo "========================================"
          python3 --version
          pip --version
          buildozer --version

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -f build.log

      - name: Build MY SHOP APK
        id: build
        run: |
          set -o pipefail

          echo "========================================"
          echo "STARTING MY SHOP APK BUILD"
          echo "========================================"

          yes | buildozer -v android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[1]}

          echo "========================================"
          echo "BUILDOZER EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          exit $BUILD_EXIT

      - name: Show Build Error
        if: failure()
        run: |
          echo ""
          echo "========================================"
          echo "LAST 300 LINES OF BUILD LOG"
          echo "========================================"

          tail -n 300 build.log || true

          echo ""
          echo "========================================"
          echo "IMPORTANT ERROR LINES"
          echo "========================================"

          grep -i -E \
            "error|exception|failed|failure|traceback|command failed|no such file|could not|not found|unsupported wheel" \
            build.log | tail -n 100 || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_SHOP-BUILD-LOG
          path: build.log
          if-no-files-found: warn

      - name: Check APK
        if: always()
        run: |
          echo "========================================"
          echo "CHECKING FOR APK"
          echo "========================================"

          ls -lah bin/ || true

          echo ""
          echo "APK FILES:"
          find . -name "*.apk" -type f -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MY_SHOP-APK
          path: bin/*.apk
