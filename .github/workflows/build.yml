name: Build MY SHOP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MY SHOP APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer==1.6.0
          python3 -m pip install cython==0.29.34

      - name: Check Buildozer
        run: |
          buildozer --version
          python3 --version
          java -version

      - name: Build MY SHOP APK
        id: build
        run: |
          set -o pipefail
          echo "========================================"
          echo "STARTING BUILDOZER BUILD"
          echo "========================================"

          yes | buildozer -v android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[1]}

          echo "========================================"
          echo "BUILDOZER EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          exit $BUILD_EXIT

      - name: Show Build Error
        if: failure()
        run: |
          echo ""
          echo "========================================"
          echo "LAST 300 LINES OF BUILD LOG"
          echo "========================================"
          tail -n 300 build.log

          echo ""
          echo "========================================"
          echo "ERROR LINES"
          echo "========================================"

          grep -i -E \
            "error|exception|failed|failure|traceback|command failed|no such file|could not|not found" \
            build.log | tail -n 100 || true

          echo ""
          echo "========================================"
          echo "END ERROR REPORT"
          echo "========================================"

      - name: Show Build Log
        if: always()
        run: |
          echo "========== BUILD LOG =========="
          cat build.log
          echo "========== END BUILD LOG =========="

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_SHOP-BUILD-LOG
          path: build.log

      - name: Check APK
        if: always()
        run: |
          echo "Checking for APK files..."
          ls -lah bin/ || true
          find . -name "*.apk" -type f -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MY_SHOP-APK
          path: bin/*.apk
