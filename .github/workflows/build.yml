name: Build MY SHOP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MY SHOP APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer==1.6.0
          python3 -m pip install cython==0.29.34

      - name: Build MY SHOP APK
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Show Build Log
        if: always()
        run: |
          echo "========== BUILD LOG =========="
          cat build.log
          echo "========== END BUILD LOG =========="

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MY_SHOP-BUILD-LOG
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MY_SHOP-APK
          path: bin/*.apk
